name: Render release-note slides

on:
  pull_request:
    paths:
      - "go*/overview*.html"
      - "go*/slide.*"
      - "scripts/render-slides.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-slides.yml"
  push:
    branches:
      - main
    paths:
      - "go*/overview*.html"
      - "go*/slide.*"
      - "scripts/render-slides.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-slides.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render and validate slides
        run: npm run render

      - name: Verify committed PNG files
        run: git diff --exit-code -- go1.27/overview.png go1.27/overview-ko.png

      - name: Upload rendered slides
        uses: actions/upload-artifact@v4
        with:
          name: go1.27-slides
          path: |
            go1.27/overview.png
            go1.27/overview-ko.png
          if-no-files-found: error
