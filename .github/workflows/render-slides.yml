name: Render release-note slides

on:
  pull_request:
    paths:
      - "go*/overview*.html"
      - "go*/slide.*"
      - "scripts/render-slides.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-slides.yml"
  push:
    branches:
      - main
    paths:
      - "go*/overview*.html"
      - "go*/slide.*"
      - "scripts/render-slides.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-slides.yml"

concurrency:
  group: render-release-note-slides
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render and validate slides
        run: npm run render

      - name: Commit rendered PNG files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add go1.27/overview.png go1.27/overview-ko.png
          if git diff --cached --quiet; then
            echo "Rendered PNG files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: Render Go 1.27 slides [skip ci]"
          git push

      - name: Upload rendered slides
        uses: actions/upload-artifact@v4
        with:
          name: go1.27-slides
          path: |
            go1.27/overview.png
            go1.27/overview-ko.png
          if-no-files-found: error
